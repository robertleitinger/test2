name: Deploy to Hostinger

# Baut die Astro-Seite und lädt sie per FTP auf die Hostinger-Subdomain.
# Läuft automatisch bei jedem Push auf einen claude/**-Branch (und auf main),
# sowie manuell über den "Run workflow"-Button.
on:
  push:
    branches:
      - 'claude/**'
      - main
  workflow_dispatch:

# Verhindert, dass sich zwei Deploys gleichzeitig in die Quere kommen.
concurrency:
  group: hostinger-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Default-Build = Staging/noindex (kein PUBLIC_SITE_LIVE gesetzt).
      - name: Build site
        run: npm run build

      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      # FTP-Upload mit automatischen Wiederholversuchen + Backoff.
      # Hostinger drosselt wiederholte FTP-Verbindungen gelegentlich
      # ("Timeout (control socket)") – die Retries fangen das ab, ohne
      # dass der Lauf manuell neu gestartet werden muss.
      # Hinweis zum Pfad: Der Account startet im Unterordner public_html,
      # aber die FTP-Wurzel "/" ist der echte Document-Root (URL /).
      - name: Deploy to Hostinger via FTP
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -uo pipefail
          deploy() {
            lftp -c "
              set cmd:fail-exit yes;
              set ftp:ssl-allow no;
              set net:timeout 25;
              set net:max-retries 2;
              set net:reconnect-interval-base 5;
              set mirror:parallel-transfer-count 3;
              open -u '$FTP_USERNAME','$FTP_PASSWORD' 'ftp://$FTP_SERVER';
              mirror --reverse --verbose --no-perms dist/ /;
            "
          }
          for attempt in 1 2 3 4 5; do
            echo "::group::FTP deploy – Versuch $attempt"
            if deploy; then
              echo "::endgroup::"
              echo "✅ Deploy erfolgreich (Versuch $attempt)"
              exit 0
            fi
            echo "::endgroup::"
            echo "⚠️ Versuch $attempt fehlgeschlagen – warte $((attempt * 15))s …"
            sleep $((attempt * 15))
          done
          echo "❌ Alle Deploy-Versuche fehlgeschlagen"
          exit 1
